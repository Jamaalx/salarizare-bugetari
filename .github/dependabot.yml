version: 2
updates:
  # Dependențe npm — săptămânal, grupate pe minor/patch ca să nu inunde PR-urile.
  # Majorele pentru next/react/react-dom sunt ignorate: se fac manual, cu test.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Amânate cu motiv (trecerea 2026-11), se fac manual împreună cu Next 16:
      # Tailwind 4 cere migrarea configurației în CSS; ESLint 10 renunță la
      # eslintrc, pe care next lint din Next 15 îl folosește; TypeScript 7 nu
      # are încă API-ul JS cu care next build verifică tipurile.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Tipurile urmează versiunea Node din producție (22), nu ultima Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Acțiunile GitHub din workflow-uri — săptămânal.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Bucharest
    commit-message:
      prefix: "chore(ci)"
